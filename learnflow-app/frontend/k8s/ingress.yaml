apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnflow-frontend-ingress
  namespace: learnflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
  - host: hackathon3.testservers.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: learnflow-frontend
            port:
              number: 3000
  tls:
  - hosts:
    - hackathon3.testservers.online
    secretName: learnflow-tls-cert
---
# Fallback ingress for nip.io domain (for testing without custom domain)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnflow-ingress-nipio
  namespace: learnflow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  ingressClassName: nginx
  rules:
  - host: learnflow.144.126.252.229.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: learnflow-frontend
            port:
              number: 3000
  tls:
  - hosts:
    - learnflow.144.126.252.229.nip.io
    secretName: learnflow-tls-nipio
