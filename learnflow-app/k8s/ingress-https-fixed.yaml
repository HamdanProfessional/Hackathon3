apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnflow-ingress-https
  namespace: learnflow
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  defaultBackend:
    service:
      name: learnflow-frontend
      port:
        number: 3000
  rules:
  - host: learnflow.68.183.246.207.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: learnflow-frontend
            port:
              number: 3000
  tls:
  - hosts:
    - learnflow.68.183.246.207.nip.io
    secretName: learnflow-tls-secret
