{{- if .Values.mcpServers.enabled }}
{{- if .Values.mcpServers.codeExecution.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "learnflow.fullname" . }}-mcp-code-exec
  labels:
    {{- include "learnflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-code-exec
spec:
  replicas: {{ .Values.mcpServers.codeExecution.replicaCount }}
  selector:
    matchLabels:
      {{- include "learnflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-code-exec
  template:
    metadata:
      labels:
        {{- include "learnflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-code-exec
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "learnflow.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: mcp-code-exec
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.mcpServers.codeExecution.image.repository }}:{{ .Values.mcpServers.codeExecution.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: {{ .Values.mcpServers.codeExecution.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "learnflow.fullname" . }}-mcp-code-exec
  labels:
    {{- include "learnflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-code-exec
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.mcpServers.codeExecution.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "learnflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-code-exec
{{- end }}
{{- if .Values.mcpServers.database.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "learnflow.fullname" . }}-mcp-database
  labels:
    {{- include "learnflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-database
spec:
  replicas: {{ .Values.mcpServers.database.replicaCount }}
  selector:
    matchLabels:
      {{- include "learnflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp-database
  template:
    metadata:
      labels:
        {{- include "learnflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcp-database
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "learnflow.fullname" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: mcp-database
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.global.imageRegistry }}/{{ .Values.mcpServers.database.image.repository }}:{{ .Values.mcpServers.database.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: {{ .Values.mcpServers.database.port }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        env:
        - name: DATABASE_HOST
          value: {{ include "learnflow.fullname" . }}-postgresql
        - name: DATABASE_PORT
          value: "5432"
        - name: DATABASE_NAME
          value: {{ .Values.postgresql.auth.database }}
        - name: DATABASE_USER
          value: {{ .Values.postgresql.auth.username }}
        - name: DATABASE_PASSWORD
          value: {{ .Values.postgresql.auth.password }}
        - name: PYTHONUNBUFFERED
          value: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "learnflow.fullname" . }}-mcp-database
  labels:
    {{- include "learnflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-database
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.mcpServers.database.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    {{- include "learnflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-database
{{- end }}
{{- end }}
