{{- range $name, $service := .Values.services }}
{{- if $service.enabled }}
{{- $serviceName := printf "%s" $name | lower }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnflow-{{ $serviceName }}-service
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: learnflow-{{ $serviceName }}-service
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learnflow-{{ $serviceName }}-service
  template:
    metadata:
      labels:
        app: learnflow-{{ $serviceName }}-service
        component: backend
      annotations:
        dapr.io/enabled: "{{ $service.dapr.enabled }}"
        dapr.io/app-id: "{{ $service.dapr.appId }}"
        dapr.io/app-port: "{{ $service.dapr.port }}"
    spec:
      imagePullSecrets:
        {{- toYaml $.Values.global.imagePullSecrets | nindent 8 }}
      containers:
      - name: {{ $serviceName }}-service
        image: "{{ $.Values.global.imageRegistry }}/{{ $service.image.repository }}:{{ $service.image.tag }}"
        imagePullPolicy: {{ $service.image.pullPolicy | default "Always" }}
        ports:
        - containerPort: {{ $service.servicePort }}
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "{{ $service.servicePort }}"
        - name: KAFKA_BROKER
          value: "learnflow-kafka-bootstrap.learnflow.svc.cluster.local:9092"
        - name: POSTGRES_HOST
          value: "learnflow-postgres-postgresql.learnflow.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: postgres-database
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: learnflow-postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: learnflow-postgres-secret
              key: password
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: learnflow-{{ $serviceName }}-service
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: learnflow-{{ $serviceName }}-service
    component: backend
spec:
  type: ClusterIP
  ports:
  - port: {{ $service.servicePort }}
    targetPort: {{ $service.servicePort }}
    protocol: TCP
    name: http
  selector:
    app: learnflow-{{ $serviceName }}-service
{{- end }}
{{- end }}
