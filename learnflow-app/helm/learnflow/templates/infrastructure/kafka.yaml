{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "learnflow.fullname" . }}-kafka
  labels:
    {{- include "learnflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  serviceName: {{ include "learnflow.fullname" . }}-kafka
  replicas: {{ .Values.kafka.replicaCount }}
  selector:
    matchLabels:
      {{- include "learnflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kafka
  template:
    metadata:
      labels:
        {{- include "learnflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: kafka
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: kafka
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
        imagePullPolicy: IfNotPresent
        ports:
        - name: kafka
          containerPort: 9092
          protocol: TCP
        command:
        - redpanda
        - start
        - --smp 1
        - --reserve-memory 0M
        - --overprovisioned
        - --node-id 0
        - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:9093
        - --advertise-kafka-addr internal://{{ include "learnflow.fullname" . }}-kafka.{{ .Release.Namespace }}.svc.cluster.local:9092
        livenessProbe:
          exec:
            command:
            - rpk
            - cluster
            - info
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - rpk
            - cluster
            - info
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.kafka.resources | nindent 10 }}
        {{- if .Values.kafka.persistence.enabled }}
        volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/redpanda/data
        {{- end }}
  {{- if .Values.kafka.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: kafka-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{ .Values.kafka.persistence.storageClass | default "" }}
      resources:
        requests:
          storage: {{ .Values.kafka.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "learnflow.fullname" . }}-kafka
  labels:
    {{- include "learnflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  ports:
  - port: {{ .Values.kafka.service.port }}
    targetPort: kafka
    protocol: TCP
    name: kafka
  selector:
    {{- include "learnflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
{{- end }}
