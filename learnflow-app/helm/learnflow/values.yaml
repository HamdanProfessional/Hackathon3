# Default values for LearnFlow Helm Chart

global:
  imageRegistry: registry.digitalocean.com/todo-chatbot-reg
  imagePullSecrets:
    - name: registry-todo-chatbot-reg
  namespace: learnflow

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# MCP Servers (disabled - deployed separately)
mcpServers:
  enabled: false

# Frontend Configuration
frontend:
  enabled: true
  image:
    repository: frontend
    tag: learnflow-v1
    pullPolicy: Always

  replicaCount: 2

  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
    hosts:
      - host: learnflow.174.138.122.121.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: learnflow-tls-secret
        hosts:
          - learnflow.174.138.122.121.nip.io

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# Backend Services
services:
  triage:
    enabled: true
    image:
      repository: learnflow-triage-service
      tag: latest
    dapr:
      enabled: true
      appId: triage-service
      port: 8001
    servicePort: 8001

  concepts:
    enabled: true
    image:
      repository: learnflow-concepts-service
      tag: latest
    dapr:
      enabled: true
      appId: concepts-service
      port: 8002
    servicePort: 8002

  debug:
    enabled: true
    image:
      repository: learnflow-debug-service
      tag: latest
    dapr:
      enabled: true
      appId: debug-service
      port: 8003
    servicePort: 8003

  exercise:
    enabled: true
    image:
      repository: learnflow-exercise-service
      tag: latest
    dapr:
      enabled: true
      appId: exercise-service
      port: 8004
    servicePort: 8004

  progress:
    enabled: true
    image:
      repository: learnflow-progress-service
      tag: latest
    dapr:
      enabled: true
      appId: progress-service
      port: 8005
    servicePort: 8005

  codeReview:
    enabled: true
    image:
      repository: learnflow-code-review-service
      tag: latest
    dapr:
      enabled: true
      appId: code-review-service
      port: 8006
    servicePort: 8006

# Infrastructure - Disabled (already deployed via separate Helm charts)
postgresql:
  enabled: false

kafka:
  enabled: false

# Security contexts
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsUser: 1001
