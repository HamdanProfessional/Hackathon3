# Default values for LearnFlow
# This is a YAML-formatted file.

# Global configuration
global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""

# Common labels
labels:
  app: learnflow
  environment: production

# Frontend configuration
frontend:
  enabled: true
  replicaCount: 2

  image:
    repository: your-org/learnflow-frontend
    pullPolicy: Always
    tag: "latest"

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    hosts:
      - host: learnflow.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  env: []
  # env:
  #   - name: NEXT_PUBLIC_API_URL
  #     value: "https://api.learnflow.example.com"

# Backend services configuration
backend:
  enabled: true
  image:
    repository: your-org/learnflow-backend
    pullPolicy: Always
    tag: "latest"

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

  # Service-specific configurations
  services:
    triage:
      enabled: true
      port: 8001
      replicaCount: 1

    concepts:
      enabled: true
      port: 8002
      replicaCount: 1

    debug:
      enabled: true
      port: 8003
      replicaCount: 1

    exercise:
      enabled: true
      port: 8004
      replicaCount: 1

    progress:
      enabled: true
      port: 8005
      replicaCount: 1

    code_review:
      enabled: true
      port: 8006
      replicaCount: 1

  env: []
  # env:
  #   - name: DATABASE_URL
  #     valueFrom:
  #       secretKeyRef:
  #         name: learnflow-secrets
  #         key: database-url

# MCP Servers configuration
mcpServers:
  enabled: true

  codeExecution:
    enabled: true
    image:
      repository: your-org/mcp-code-exec
      tag: "latest"
    port: 9000
    replicaCount: 1

  database:
    enabled: true
    image:
      repository: your-org/mcp-database
      tag: "latest"
    port: 9001
    replicaCount: 1

# PostgreSQL configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
  replicaCount: 1

  auth:
    database: learnflow
    username: learnflow
    password: "changeme"

  service:
    port: 5432

  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Kafka/Redpanda configuration
kafka:
  enabled: true
  image:
    repository: redpandadata/redpanda
    tag: "v23.1.8"
  replicaCount: 1

  service:
    port: 9092

  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ConfigMap and Secret management
configMap:
  # Database URL template
  databaseUrlTemplate: "postgresql+asyncpg://%s:%s@postgresql.%s.svc.cluster.local:5432/%s"

  # Kafka brokers
  kafkaBrokers: "kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"

secrets:
  # These should be created externally using Kubernetes secrets
  # The chart will reference them but not create them
  databasePassword:
    name: learnflow-secrets
    key: database-password

  openaiApiKey:
    name: learnflow-secrets
    key: openai-api-key

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Pod annotations
podAnnotations: {}

# Pod security context
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

# Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Health check probes
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
