# Default values for LearnFlow Helm Chart

global:
  imageRegistry: registry.digitalocean.com/todo-chatbot-reg
  imagePullSecrets:
    - name: registry-todo-chatbot-reg
  namespace: learnflow

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# MCP Servers
mcpServers:
  enabled: true
  codeExecution:
    enabled: true
    replicaCount: 1
    image:
      repository: mcp-code-exec-server
      tag: v2
    port: 9000
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  database:
    enabled: true
    replicaCount: 1
    image:
      repository: mcp-database-server
      tag: v2
    port: 9001
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  k8sOperations:
    enabled: true
    replicaCount: 1
    image:
      repository: mcp-k8s-operations-server
      tag: v2
    port: 9003
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

# Frontend Configuration
frontend:
  enabled: true
  image:
    repository: frontend
    tag: learnflow-v2
    pullPolicy: Always

  replicaCount: 1  # Reduced from 2 to save CPU

  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000

  ingress:
    enabled: false

  resources:
    limits:
      cpu: 300m  # Reduced from 500m
      memory: 384Mi  # Reduced from 512Mi
    requests:
      cpu: 100m  # Reduced from 250m
      memory: 128Mi  # Reduced from 256Mi

  autoscaling:
    enabled: false  # Disabled to save resources

# Backend Services
services:
  triage:
    enabled: false  # Using manual deployment instead
    image:
      repository: learnflow-triage-service
      tag: latest
    dapr:
      enabled: true
      appId: triage-service
      port: 8001
    servicePort: 8001

  concepts:
    enabled: false  # No :latest tag exists
    image:
      repository: learnflow-concepts-service
      tag: latest
    dapr:
      enabled: true
      appId: concepts-service
      port: 8002
    servicePort: 8002

  debug:
    enabled: false  # No :latest tag exists
    image:
      repository: learnflow-debug-service
      tag: latest
    dapr:
      enabled: true
      appId: debug-service
      port: 8003
    servicePort: 8003

  exercise:
    enabled: true
    image:
      repository: learnflow-exercise-service
      tag: v3
    dapr:
      enabled: true
      appId: exercise-service
      port: 8004
    servicePort: 8004

  progress:
    enabled: false  # Using manual deployment instead
    image:
      repository: learnflow-progress-service
      tag: latest
    dapr:
      enabled: true
      appId: progress-service
      port: 8005
    servicePort: 8005

  codeReview:
    enabled: false  # No :latest tag exists
    image:
      repository: learnflow-code-review-service
      tag: latest
    dapr:
      enabled: true
      appId: code-review-service
      port: 8006
    servicePort: 8006

# Infrastructure - Disabled (already deployed via separate Helm charts)
postgresql:
  enabled: false
  auth:
    database: learnflow
    username: learnflow
    password: learnflow123

kafka:
  enabled: false

# Security contexts
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  runAsUser: 1001
