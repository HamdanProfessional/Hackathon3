[project]
name = "chat-service"
version = "1.0.0"
description = "Chat service for LearnFlow platform"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "psycopg2-binary>=2.9.10",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
