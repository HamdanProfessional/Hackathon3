---
# MCP Kafka Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-kafka-server
  namespace: learnflow
  labels:
    app: mcp-kafka-server
    tier: mcp
spec:
  imagePullSecrets:
  - name: docr-secret
  replicas: 1
  selector:
    matchLabels:
      app: mcp-kafka-server
  template:
    metadata:
      labels:
        app: mcp-kafka-server
        tier: mcp
    spec:
      containers:
      - name: mcp-kafka-server
        image: registry.digitalocean.com/learnflow-registry/mcp-kafka-server:latest
        imagePullPolicy: Always
        command: ["python", "main.py"]
        env:
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "redpanda.redpanda-system.svc.cluster.local:9092"
        - name: KAFKA_CONSUMER_GROUP
          value: "mcp-kafka-server"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
