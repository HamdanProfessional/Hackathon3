---
# MCP Kubernetes Operations Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-k8s-operations-server
  namespace: learnflow
  labels:
    app: mcp-k8s-operations-server
    tier: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-k8s-operations-server
  template:
    metadata:
      labels:
        app: mcp-k8s-operations-server
        tier: mcp
    spec:
      containers:
      - name: mcp-k8s-operations-server
        image: registry.digitalocean.com/learnflow-registry/mcp-k8s-operations-server:latest
        imagePullPolicy: Always
        command: ["python", "main.py"]
        env:
        - name: KUBECONFIG
          value: "/root/.kube/config"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-k8s-operations-server
  namespace: learnflow
  labels:
    app: mcp-k8s-operations-server
    tier: mcp
spec:
  type: ClusterIP
  ports:
  - port: 9003
    targetPort: 9003
    protocol: TCP
    name: http
  selector:
    app: mcp-k8s-operations-server
