---
# NodePort Services for ALL Backend Services
# Allows external access via <node-ip>:<nodeport>

apiVersion: v1
kind: Service
metadata:
  name: triage-service-nodeport
  namespace: learnflow
spec:
  type: NodePort
  selector:
    app: triage-service
  ports:
  - port: 8001
    targetPort: 8001
    nodePort: 30801

