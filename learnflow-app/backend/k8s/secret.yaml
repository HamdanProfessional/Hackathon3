---
# Secret for LearnFlow Backend Services
# Contains sensitive configuration values
# NOTE: In production, use sealed-secrets, external-secrets, or vault
apiVersion: v1
kind: Secret
metadata:
  name: learnflow-api-secret
  namespace: learnflow
type: Opaque
stringData:
  # OpenAI API Key
  # Generate at: https://platform.openai.com/api-keys
  openai-api-key: "sk-your-openai-api-key-here"

  # JWT Secret for authentication
  # Generate with: openssl rand -base64 32
  jwt-secret: "change-this-to-a-random-32-character-string"

  # Database connection string (for PostgreSQL state store)
  # Format: postgresql://user:password@host:port/database
  # This is used by the Dapr state store component
  database-url: "postgresql://learnflow:learnflow-password@postgresql:5432/learnflow"

  # Dapr state store connection string
  # PostgreSQL connection for Dapr state management
  connection-string: "host=postgresql port=5432 user=learnflow password=learnflow-password dbname=learnflow"

---
# Additional Secret for Database credentials
apiVersion: v1
kind: Secret
metadata:
  name: learnflow-db-secret
  namespace: learnflow
type: Opaque
stringData:
  # PostgreSQL connection string for Dapr state store
  connection-string: "host=postgresql port=5432 user=learnflow password=learnflow-password dbname=learnflow sslmode=disable"
  postgres-host: "postgresql"
  postgres-port: "5432"
  postgres-user: "learnflow"
  postgres-password: "learnflow-password"
  postgres-dbname: "learnflow"
