---
# Exercise Service Deployment - Updated with Teacher Assignment Generation
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exercise-service
  namespace: learnflow
  labels:
    app: exercise-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exercise-service
  template:
    metadata:
      labels:
        app: exercise-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "exercise-service"
        dapr.io/app-port: "8004"
        dapr.io/log-level: "info"
        dapr.io/sidecar-cpu-limit: "300m"
        dapr.io/sidecar-memory-limit: "256Mi"
        dapr.io/enable-app-health-check: "true"
        dapr.io/app-health-check-path: "/health"
    spec:
      containers:
      - name: exercise
        image: python:3.13-slim
        imagePullPolicy: Always
        command:
        - sh
        - -c
        - |
          set -e
          # Install dependencies
          pip install --no-cache-dir uv fastapi uvicorn pydantic httpx

          # Create directory structure
          mkdir -p /app/services/exercise
          touch /app/services/__init__.py
          touch /app/services/exercise/__init__.py

          # Write the exercise service code with teacher endpoints
          cat > /app/services/exercise/main.py << 'EOFPYTHON'
          import asyncio
          from datetime import datetime, timedelta
          from typing import List, Optional
          from uuid import uuid4
          from fastapi import FastAPI, HTTPException
          from fastapi.middleware.cors import CORSMiddleware
          from pydantic import BaseModel
          import httpx

          SERVICE_NAME = "exercise-service"
          SERVICE_VERSION = "2.0.0"
          PORT = 8004

          app = FastAPI(title="LearnFlow Exercise Service", version=SERVICE_VERSION)
          app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True, allow_methods=["*"], allow_headers=["*"])

          # ============================================================================
          # Models
          # ============================================================================

          class Exercise(BaseModel):
              id: str
              title: str
              difficulty: str
              description: str
              instructions: str
              starter_code: str
              solution: str
              test_cases: List[dict]
              hints: List[str]
              skills: List[str]
              points: int
              module_id: str
              topic: str

          class ExerciseSubmission(BaseModel):
              exercise_id: str
              code: str
              language: str = "python"

          class ExerciseResult(BaseModel):
              passed: bool
              feedback: str
              test_results: List[dict]
              output: str = ""
              error: str = ""

          class HealthResponse(BaseModel):
              status: str
              service: str
              version: str

          # ============================================================================
          # Mock Exercise Database (43 exercises across 8 modules)
          # ============================================================================

          ALL_EXERCISES = {
              # Sample exercises - in production would have all 43
              "basics_1": Exercise(
                  id="ex_1_1", title="Your First Variable", difficulty="beginner",
                  description="Create a variable called `my_name` and assign your name to it.",
                  instructions="Create a variable called `my_name` and assign your name to it. Then print it.",
                  starter_code="# Write your code below\n",
                  solution='my_name = "YourName"\nprint(my_name)',
                  test_cases=[{"check": "my_name", "type": "code_check"}],
                  hints=["Use the assignment operator (=)", "Variables can hold strings"],
                  skills=["variables", "print"], points=10, module_id="basics", topic="Variables"
              ),
              "control_1": Exercise(
                  id="ex_2_1", title="If-Else Statement", difficulty="beginner",
                  description="Check if a number is positive or negative.",
                  instructions="Write a program that checks if a number is positive or negative.",
                  starter_code="number = 5\n# Add your code below",
                  solution='if number > 0:\n    print("Positive")\nelse:\n    print("Negative")',
                  test_cases=[],
                  hints=["Use if-else structure", "The > operator checks if positive"],
                  skills=["if-else", "comparison"], points=15, module_id="control_flow", topic="Conditionals"
              ),
              "data_1": Exercise(
                  id="ex_3_1", title="List Operations", difficulty="beginner",
                  description="Create a list and perform operations.",
                  instructions="Create a list of fruits and add/remove items.",
                  starter_code='fruits = ["apple", "banana"]\n',
                  solution='fruits.append("cherry")\nprint(fruits)',
                  test_cases=[],
                  hints=[".append() adds to end", ".pop() removes items"],
                  skills=["lists"], points=20, module_id="data_structures", topic="Lists"
              ),
          }

          # ============================================================================
          # Endpoints
          # ============================================================================

          @app.get("/")
          async def root():
              return {"service": SERVICE_NAME, "version": SERVICE_VERSION, "status": "running"}

          @app.get("/health")
          async def health():
              return {"status": "healthy", "service": SERVICE_NAME, "version": SERVICE_VERSION}

          @app.get("/exercises/all")
          async def get_all_exercises():
              return {"exercises": [e.model_dump() for e in ALL_EXERCISES.values()], "total": len(ALL_EXERCISES)}

          @app.get("/modules")
          async def get_modules():
              return {
                  "modules": [
                      {"id": "basics", "name": "Python Basics", "exercises": 5},
                      {"id": "control_flow", "name": "Control Flow", "exercises": 6},
                      {"id": "data_structures", "name": "Data Structures", "exercises": 5},
                      {"id": "functions", "name": "Functions", "exercises": 4},
                      {"id": "oop", "name": "OOP", "exercises": 4},
                      {"id": "files", "name": "Files", "exercises": 4},
                      {"id": "errors", "name": "Error Handling", "exercises": 4},
                      {"id": "libraries", "name": "Libraries", "exercises": 4},
                  ]
              }

          @app.get("/exercise/{exercise_id}")
          async def get_exercise(exercise_id: str):
              for exercise in ALL_EXERCISES.values():
                  if exercise.id == exercise_id:
                      return exercise.model_dump()
              raise HTTPException(status_code=404, detail="Exercise not found")

          @app.post("/execute")
          async def execute_code(submission: ExerciseSubmission):
              # Simple code execution - in production would use MCP
              return {
                  "output": "Code executed successfully",
                  "error": None,
                  "execution_time": 0.1
              }

          # ============================================================================
          # Teacher Assignment Generation
          # ============================================================================

          class TeacherAssignmentRequest(BaseModel):
              prompt: str
              difficulty: str
              topic: Optional[str] = None
              module_id: Optional[str] = None

          @app.post("/api/v1/teacher/generate-assignment")
          async def generate_teacher_assignment(request: TeacherAssignmentRequest):
              exercise_id = f"teacher_{uuid4().hex[:8]}"

              difficulty_points = {"beginner": 10, "intermediate": 25, "advanced": 40}

              generated_exercise = Exercise(
                  id=exercise_id,
                  title=f"Custom: {request.prompt[:50]}",
                  difficulty=request.difficulty,
                  description=f"Complete this exercise: {request.prompt}",
                  instructions=f"""Complete the following exercise:

{request.prompt}

Difficulty: {request.difficulty}
{f'Topic: {request.topic}' if request.topic else ''}

Requirements:
- Follow Python best practices
- Include proper error handling
- Add comments to explain your code""",
                  starter_code=f"# Custom Exercise ({request.difficulty})\n# {request.prompt}\n\n# Your solution:\n",
                  solution=f"# Solution for: {request.prompt}\nprint('Exercise completed!')",
                  test_cases=[{"check": "print"}],
                  hints=["Read carefully", "Break down the problem", "Test your code"],
                  skills=[request.topic.lower() if request.topic else "problem-solving", request.difficulty],
                  points=difficulty_points.get(request.difficulty, 20),
                  module_id=request.module_id or "custom",
                  topic=request.topic or "Custom Assignment"
              )

              return {
                  "exercise": generated_exercise.model_dump(),
                  "preview": f"Custom: {generated_exercise.title}\n\nDifficulty: {request.difficulty}\nPoints: {generated_exercise.points}"
              }

          @app.post("/api/v1/teacher/save-assignment")
          async def save_teacher_assignment(exercise_id: str, student_ids: List[str], note: Optional[str] = None):
              return {
                  "message": f"Assignment {exercise_id} created for {len(student_ids)} student(s)",
                  "exercise_id": exercise_id,
                  "assigned_students": student_ids,
                  "note": note
              }

          if __name__ == "__main__":
              import uvicorn
              uvicorn.run(app, host="0.0.0.0", port=PORT)
          EOFPYTHON

          # Run the service
          cd /app && python -m uvicorn services.exercise.main:app --host 0.0.0.0 --port 8004
        ports:
        - containerPort: 8004
        env:
        - name: PORT
          value: "8004"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exercise-service
  namespace: learnflow
spec:
  selector:
    app: exercise-service
  ports:
  - port: 8004
    targetPort: 8004
  type: ClusterIP
