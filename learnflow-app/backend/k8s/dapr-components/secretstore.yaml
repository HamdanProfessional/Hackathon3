---
# Dapr Secret Store Component using Kubernetes Secrets
# Allows services to securely access secrets
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: learnflow-secretstore
  namespace: learnflow
spec:
  type: secretstores.kubernetes
  version: v1
  metadata:
    # No additional metadata needed for Kubernetes secret store
    # Secrets are accessed via: kubernetes://<secret-name>/<key>
---
# Example Usage:
# To access a secret value from a service:
#   secret = await dapr_client.get_secret(secret_name="learnflow-api-secret", key="api-key")
#   api_key = secret.value
