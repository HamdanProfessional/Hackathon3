---
# Triage Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  namespace: learnflow
  labels:
    app: triage-service
spec:
  imagePullSecrets:
  - name: docr-secret
  replicas: 1
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "triage-service"
        dapr.io/app-port: "8001"
        dapr.io/log-level: "info"
        dapr.io/sidecar-cpu-limit: "300m"
        dapr.io/sidecar-memory-limit: "256Mi"
        dapr.io/enable-app-health-check: "true"
        dapr.io/app-health-check-path: "/health"
    spec:
      containers:
      - name: triage
        image: registry.digitalocean.com/learnflow-registry/learnflow-backend:latest
        imagePullPolicy: Always
        command: ["python", "-m", "uvicorn", "services.triage.main:app", "--host", "0.0.0.0", "--port", "8001"]
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: database-url
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: triage-service
  namespace: learnflow
spec:
  selector:
    app: triage-service
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP

