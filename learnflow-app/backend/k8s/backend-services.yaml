---
# Triage Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  namespace: learnflow
  labels:
    app: triage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
    spec:
      containers:
      - name: triage
        image: learnflow-backend:latest
        imagePullPolicy: IfNotPresent
        command: ["python", "-m", "uvicorn", "services.triage.main:app", "--host", "0.0.0.0", "--port", "8001"]
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
        - name: DATABASE_URL
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: database-url
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 300m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: triage-service
  namespace: learnflow
spec:
  selector:
    app: triage-service
  ports:
  - port: 8001
    targetPort: 8001
  type: ClusterIP

