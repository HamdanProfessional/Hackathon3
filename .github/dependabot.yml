version: 2
updates:
  # Backend dependencies (Python)
  - package-ecosystem: "pip"
    directory: "/learnflow-app/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "your-org/tech-lead"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # Ignore major version updates for stability
      - dependency-name: "fastapi"
        update-types: ["version-update:major"]
      - dependency-name: "sqlmodel"
        update-types: ["version-update:major"]

  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/learnflow-app/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "your-org/tech-lead"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # Ignore major version updates for Next.js and React
      - dependency-name: "next"
        update-types: ["version-update:major"]
      - dependency-name: "react"
        update-types: ["version-update:major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
