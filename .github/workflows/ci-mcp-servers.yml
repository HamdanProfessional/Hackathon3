name: MCP Servers CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'learnflow-app/backend/mcp-servers/**'
      - '.github/workflows/ci-mcp-servers.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'learnflow-app/backend/mcp-servers/**'
      - '.github/workflows/ci-mcp-servers.yml'

env:
  REGISTRY: ghcr.io

jobs:
  validate-mcp-servers:
    name: Validate MCP Servers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learnflow-app/backend/mcp-servers

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ../../

      - name: Validate MCP server structure
        run: |
          for server in */; do
            echo "Checking $server"
            if [ -f "$server/main.py" ]; then
              echo "✓ $server has main.py"
            else
              echo "✗ $server missing main.py"
              exit 1
            fi
          done

  build-database-mcp:
    name: Build Database MCP Server
    runs-on: ubuntu-latest
    needs: validate-mcp-servers
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Database MCP
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/backend/mcp-servers/database-mcp
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-database:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-database:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-code-exec-mcp:
    name: Build Code Execution MCP Server
    runs-on: ubuntu-latest
    needs: validate-mcp-servers
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Code Execution MCP
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/backend/mcp-servers/code-execution-mcp
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-code-exec:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/mcp-code-exec:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
