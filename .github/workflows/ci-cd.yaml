name: LearnFlow CI/CD Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  REGISTRY: registry.digitalocean.com
  REPO_PREFIX: todo-chatbot-reg

jobs:
  # Backend Tests Job
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov
          if [ -f learnflow-app/backend/requirements.txt ]; then
            pip install -r learnflow-app/backend/requirements.txt || true
          fi

      - name: Run backend tests
        run: |
          if [ -d learnflow-app/backend/tests ]; then
            cd learnflow-app/backend && pytest tests/ -v --cov=. --cov-report=xml || echo "No tests found or tests failed"
          else
            echo "No backend tests directory found"
          fi

  # Frontend Tests Job
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ -f learnflow-app/frontend/package.json ]; then
            cd learnflow-app/frontend && npm ci || echo "No frontend package.json found"
          fi

      - name: Run frontend tests
        run: |
          if [ -d learnflow-app/frontend ]; then
            cd learnflow-app/frontend && npm test -- --passWithNoTests || echo "No tests configured"
          fi

  # Build and Push Images Job
  build-and-push:
    name: Build and Push Container Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCR_TOKEN }}
          password: ${{ secrets.DOCR_TOKEN }}

      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=learnflow-{{date 'YYYY.MM.dd'}}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Backend Services
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/learnflow-${{ matrix.service }}-service
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest
        env:
          matrix_service: triage

      # Build backend service images
      - name: Build and push Triage Service
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/backend/services/triage
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/learnflow-triage-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Concepts Service
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/backend/services/concepts
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/learnflow-concepts-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Debug Service
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/backend/services/debug
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/learnflow-debug-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Exercise Service
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/backend/services/exercise
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/learnflow-exercise-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Progress Service
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/backend/services/progress
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/learnflow-progress-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Code Review Service
        uses: docker/build-push-action@v5
        with:
          context: learnflow-app/backend/services/code-review
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_PREFIX }}/learnflow-code-review-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Update Argo CD Job
  update-argocd:
    name: Trigger Argo CD Sync
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Argo CD CLI
        run: |
          curl -sSL -o argocd-linux-amd64 https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          sudo install -m 555 argocd-linux-amd64 /usr/local/bin/argocd
          argocd version --short

      - name: Authenticate with Argo CD
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd login "$ARGOCD_SERVER" --auth-token "$ARGOCD_AUTH_TOKEN"

      - name: Trigger Argo CD Sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          argocd app get learnflow
          argocd app sync learnflow --timeout 300
          argocd app wait learnflow --health healthy --timeout 600
