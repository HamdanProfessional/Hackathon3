apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-test-job
  namespace: learnflow
spec:
  template:
    spec:
      containers:
      - name: kafka-test
        image: python:3.11-slim
        command:
        - /bin/sh
        - -c
        - |
          pip install confluent-kafka 2>&1 | tail -3
          python3 << 'PYEOF'
from confluent_kafka import Producer
import json

config = {
    'bootstrap.servers': 'redpanda.redpanda-system.svc.cluster.local:9093',
    'client.id': 'kafka-test-producer',
    'acks': 'all'
}

producer = Producer(config)
topic = 'learning.progress'
event = {'test': 'kafka_client', 'timestamp': '2026-01-24'}

def delivery_report(err, msg):
    if err:
        print(f"ERROR: {err}")
    else:
        print(f"SUCCESS: Event delivered to {msg.topic()}")

producer.produce(
    topic=topic,
    key=b'test-key',
    value=json.dumps(event).encode('utf-8'),
    on_delivery=delivery_report
)
producer.flush(timeout=10)
print("Kafka client test: COMPLETE")
PYEOF
        restartPolicy: Never
      backoffLimit: 0
