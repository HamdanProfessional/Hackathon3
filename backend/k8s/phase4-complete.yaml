# Debug Service with full business logic
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-service-complete
  namespace: learnflow
data:
  main.py: |
    """Debug Service - Helps students debug code with progressive hints."""
    import sys
    import os
    import json
    import logging
    import re
    from typing import Dict, Any, Optional
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Debug Service", version="3.0.0")

    try:
        from openai import AsyncOpenAI
        HAS_LLM = True
    except ImportError:
        HAS_LLM = False

    class DebugRequest(BaseModel):
        code: str
        error_message: str
        hint_level: int = 1  # 1=subtle, 2=moderate, 3=direct
        student_id: Optional[str] = None

    class DebugResponse(BaseModel):
        hints: list[str]
        likely_cause: str
        suggested_fix: str
        hint_level: int

    # Common error patterns
    ERROR_PATTERNS = {
        "SyntaxError": {
            "hints": [
                "Check for missing parentheses, brackets, or quotes",
                "Look for colons (:) after if, for, while, def, class statements",
                "Verify proper indentation - Python is strict about this"
            ],
            "likely_cause": "Invalid Python syntax",
            "suggested_fix": "Review the line number and check for syntax issues"
        },
        "IndentationError": {
            "hints": [
                "Python uses consistent indentation (usually 4 spaces)",
                "Don't mix tabs and spaces",
                "Check that all blocks are indented consistently"
            ],
            "likely_cause": "Inconsistent or incorrect indentation",
            "suggested_fix": "Use 4 spaces for each indentation level consistently"
        },
        "NameError": {
            "hints": [
                "Check if the variable name is spelled correctly",
                "Ensure the variable is defined before it's used",
                "Look for typos in variable names"
            ],
            "likely_cause": "Variable or function name not found",
            "suggested_fix": "Define the variable before using it or check for typos"
        },
        "TypeError": {
            "hints": [
                "Check if you're mixing incompatible types (e.g., string + number)",
                "Verify function arguments match expected types",
                "Look for type conversion issues"
            ],
            "likely_cause": "Operation between incompatible types",
            "suggested_fix": "Convert types explicitly using str(), int(), float()"
        },
        "IndexError": {
            "hints": [
                "Check if the index is within the valid range",
                "Remember: Python lists are 0-indexed",
                "Use len() to check the length before accessing"
            ],
            "likely_cause": "List or sequence index out of range",
            "suggested_fix": "Verify the index is between 0 and len(sequence)-1"
        }
    }

    def identify_error_type(error_msg: str) -> Optional[str]:
        """Extract error type from error message."""
        for error_type in ERROR_PATTERNS.keys():
            if error_type in error_msg:
                return error_type
        return None

    async def debug_with_llm(code: str, error: str, hint_level: int) -> DebugResponse:
        """Use LLM to generate debugging hints."""
        try:
            api_key = os.getenv("GLM_API_KEY") or os.getenv("OPENAI_API_KEY")
            if not api_key:
                return debug_fallback(error, hint_level)

            base_url = os.getenv("LLM_BASE_URL", "https://open.bigmodel.cn/api/paas/v4/")
            model = os.getenv("LLM_MODEL", "glm-4.7-flash")

            client = AsyncOpenAI(api_key=api_key, base_url=base_url)

            hint_guidance = {
                1: "Give subtle hints that guide the student without revealing the answer",
                2: "Provide moderate hints that point to the issue",
                3: "Give clear, direct explanations"
            }

            system_prompt = f"""You are a programming tutor helping debug Python code.
            {hint_guidance.get(hint_level, hint_guidance[1])}
            Return JSON: {{
                "hints": ["hint1", "hint2"],
                "likely_cause": "what's probably wrong",
                "suggested_fix": "how to fix it"
            }}"""

            response = await client.chat.completions.create(
                model=model,
                messages=[
                    {"role": "system", "content": system_prompt},
                    {"role": "user", "content": f"Code:\n{code}\n\nError:\n{error}"}
                ],
                temperature=0.5,
                max_tokens=600
            )

            result = json.loads(response.choices[0].message.content)
            return DebugResponse(
                hints=result.get("hints", []),
                likely_cause=result.get("likely_cause", "Unknown"),
                suggested_fix=result.get("suggested_fix", "Review the error"),
                hint_level=hint_level
            )
        except Exception as e:
            logger.error(f"LLM debug failed: {e}")
            return debug_fallback(error, hint_level)

    def debug_fallback(error: str, hint_level: int) -> DebugResponse:
        """Fallback to pattern-based debugging."""
        error_type = identify_error_type(error)
        if error_type and error_type in ERROR_PATTERNS:
            pattern = ERROR_PATTERNS[error_type]
            num_hints = min(hint_level, len(pattern["hints"]))
            return DebugResponse(
                hints=pattern["hints"][:num_hints],
                likely_cause=pattern["likely_cause"],
                suggested_fix=pattern["suggested_fix"],
                hint_level=hint_level
            )
        return DebugResponse(
            hints=[f"Review the error message: {error[:100]}"],
            likely_cause="Unknown error type",
            suggested_fix="Check the error message and code carefully",
            hint_level=hint_level
        )

    @app.get("/")
    async def root():
        return {"service": "debug-service", "version": "3.0.0", "llm_enabled": HAS_LLM}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "debug-service"}

    @app.post("/api/v1/debug", response_model=DebugResponse)
    async def debug_code(request: DebugRequest) -> DebugResponse:
        """Provide debugging hints."""
        try:
            logger.info(f"Debug request (hint level {request.hint_level}): {request.error_message[:50]}...")
            if HAS_LLM:
                return await debug_with_llm(request.code, request.error_message, request.hint_level)
            return debug_fallback(request.error_message, request.hint_level)
        except Exception as e:
            logger.error(f"Debug error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8003)

