# Progress Service with full business logic
apiVersion: v1
kind: ConfigMap
metadata:
  name: progress-service-complete
  namespace: learnflow
data:
  main.py: |
    """Progress Service - Tracks student mastery and progress."""
    import sys
    import os
    import json
    import logging
    from typing import Dict, Any, Optional
    from datetime import datetime
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Progress Service", version="3.0.0")

    class ProgressRequest(BaseModel):
        student_id: str

    class ProgressResponse(BaseModel):
        student_id: str
        overall_mastery: float
        topic_masteries: Dict[str, float]
        streak_days: int
        exercises_completed: int
        last_active: str

    # In-memory progress storage (in production, use database)
    progress_data = {
        "sample_student": {
            "overall_mastery": 35.5,
            "topic_masteries": {
                "variables": 60.0,
                "loops": 45.0,
                "functions": 25.0,
                "classes": 10.0
            },
            "streak_days": 3,
            "exercises_completed": 5,
            "last_active": datetime.now().isoformat()
        }
    }

    @app.get("/")
    async def root():
        return {"service": "progress-service", "version": "3.0.0"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "progress-service"}

    @app.get("/api/v1/progress/{student_id}", response_model=ProgressResponse)
    async def get_progress(student_id: str) -> ProgressResponse:
        """Get student progress."""
        try:
            logger.info(f"Fetching progress for {student_id}")
            if student_id in progress_data:
                data = progress_data[student_id]
                return ProgressResponse(
                    student_id=student_id,
                    overall_mastery=data["overall_mastery"],
                    topic_masteries=data["topic_masteries"],
                    streak_days=data["streak_days"],
                    exercises_completed=data["exercises_completed"],
                    last_active=data["last_active"]
                )
            # Return default progress for new students
            return ProgressResponse(
                student_id=student_id,
                overall_mastery=0.0,
                topic_masteries={},
                streak_days=0,
                exercises_completed=0,
                last_active=datetime.now().isoformat()
            )
        except Exception as e:
            logger.error(f"Progress error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    @app.post("/api/v1/progress/{student_id}/update")
    async def update_progress(student_id: str, update_data: Dict[str, Any]):
        """Update student progress."""
        try:
            logger.info(f"Updating progress for {student_id}")
            if student_id not in progress_data:
                progress_data[student_id] = {
                    "overall_mastery": 0.0,
                    "topic_masteries": {},
                    "streak_days": 0,
                    "exercises_completed": 0,
                    "last_active": datetime.now().isoformat()
                }
            progress_data[student_id]["last_active"] = datetime.now().isoformat()
            return {"status": "updated", "student_id": student_id}
        except Exception as e:
            logger.error(f"Progress update error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8005)

---
# Code Review Service with full business logic
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-review-service-complete
  namespace: learnflow
data:
  main.py: |
    """Code Review Service - Reviews code for correctness, style, and efficiency."""
    import sys
    import os
    import json
    import logging
    import re
    from typing import Dict, Any, Optional, List
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Code Review Service", version="3.0.0")

    try:
        from openai import AsyncOpenAI
        HAS_LLM = True
    except ImportError:
        HAS_LLM = False

    class ReviewRequest(BaseModel):
        code: str
        language: str = "python"
        student_id: Optional[str] = None

    class ReviewResponse(BaseModel):
        overall_score: float  # 0-100
        correctness_score: float
        style_score: float
        efficiency_score: float
        feedback: str
        suggestions: List[str]
        issues: List[Dict[str, str]]

    # Code quality checks
    def check_pep8_compliance(code: str) -> List[Dict[str, str]]:
        """Basic PEP 8 style checks."""
        issues = []
        lines = code.split('\n')

        for i, line in enumerate(lines, 1):
            # Line length
            if len(line) > 79:
                issues.append({
                    "line": i,
                    "type": "style",
                    "message": f"Line exceeds 79 characters ({len(line)} chars)"
                })
            # Trailing whitespace
            if line.rstrip() != line and line.strip():
                issues.append({
                    "line": i,
                    "type": "style",
                    "message": "Trailing whitespace"
                })
            # Missing docstring for function
            if line.strip().startswith('def ') and i < len(lines):
                next_line = lines[i].strip() if i < len(lines) else ''
                if not next_line.startswith('"""') and not next_line.startswith("'"):
                    issues.append({
                        "line": i,
                        "type": "style",
                        "message": "Function missing docstring"
                    })

        return issues

    async def review_with_llm(code: str) -> ReviewResponse:
        """Use LLM for comprehensive code review."""
        try:
            api_key = os.getenv("GLM_API_KEY") or os.getenv("OPENAI_API_KEY")
            if not api_key:
                return review_basic(code)

            base_url = os.getenv("LLM_BASE_URL", "https://open.bigmodel.cn/api/paas/v4/")
            model = os.getenv("LLM_MODEL", "glm-4.7-flash")

            client = AsyncOpenAI(api_key=api_key, base_url=base_url)

            system_prompt = """Review the Python code for correctness, style, and efficiency.
            Return JSON: {{
                "overall_score": 85.0,
                "correctness_score": 90.0,
                "style_score": 80.0,
                "efficiency_score": 85.0,
                "feedback": "overall feedback",
                "suggestions": ["improvement1", "improvement2"],
                "issues": [{{"type": "style|correctness|efficiency", "message": "issue"}}]
            }}"""

            response = await client.chat.completions.create(
                model=model,
                messages=[
                    {"role": "system", "content": system_prompt},
                    {"role": "user", "content": f"Review this code:\n\n{code}"}
                ],
                temperature=0.5,
                max_tokens=800
            )

            result = json.loads(response.choices[0].message.content)
            return ReviewResponse(**result)
        except Exception as e:
            logger.error(f"LLM review failed: {e}")
            return review_basic(code)

    def review_basic(code: str) -> ReviewResponse:
        """Basic rule-based code review."""
        issues = check_pep8_compliance(code)

        # Calculate scores
        style_score = max(0, 100 - len(issues) * 10)
        correctness_score = 100.0  # Would run actual tests in production
        efficiency_score = 85.0   # Would analyze complexity in production
        overall_score = (style_score + correctness_score + efficiency_score) / 3

        return ReviewResponse(
            overall_score=round(overall_score, 1),
            correctness_score=round(correctness_score, 1),
            style_score=round(style_score, 1),
            efficiency_score=round(efficiency_score, 1),
            feedback=f"Code has {len(issues)} style issue(s). Overall looks good!" if len(issues) < 3 else "Multiple style issues found.",
            suggestions=["Add docstrings to functions", "Consider adding error handling", "Follow PEP 8 guidelines"],
            issues=issues[:10]  # Limit to first 10 issues
        )

    @app.get("/")
    async def root():
        return {"service": "code-review-service", "version": "3.0.0", "llm_enabled": HAS_LLM}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "code-review-service"}

    @app.post("/api/v1/review", response_model=ReviewResponse)
    async def review_code(request: ReviewRequest) -> ReviewResponse:
        """Review code for quality."""
        try:
            logger.info(f"Reviewing {len(request.code)} chars of code")
            if HAS_LLM:
                return await review_with_llm(request.code)
            return review_basic(request.code)
        except Exception as e:
            logger.error(f"Review error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8006)

