# Triage Service with full business logic
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-service-complete
  namespace: learnflow
data:
  main.py: |
    """Triage Service - Routes queries to appropriate specialist services."""
    import sys
    import os
    import json
    import logging
    from typing import Dict, Any, Optional
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Triage Service", version="3.0.0")

    # Try to import LLM client (optional - works without it too)
    try:
        from openai import AsyncOpenAI
        HAS_LLM = True
        logger.info("LLM client available")
    except ImportError:
        HAS_LLM = False
        logger.warning("LLM client not available - using rule-based routing")

    # Request/Response Models
    class TriageRequest(BaseModel):
        query: str
        student_id: Optional[str] = None
        context: Optional[Dict[str, Any]] = None

    class TriageResponse(BaseModel):
        target_service: str
        confidence: float
        reasoning: str
        suggested_action: str

    # Keyword-based routing (fallback)
    ROUTING_RULES = {
        "concepts": ["explain", "what is", "how does", "concept", "definition", "meaning"],
        "debug": ["error", "bug", "not working", "exception", "traceback", "fix"],
        "exercise": ["exercise", "practice", "challenge", "quiz", "problem"],
        "code-review": ["review", "improve", "refactor", "better way", "optimize"],
        "progress": ["progress", "score", "mastery", "how am i doing", "stats"]
    }

    def route_by_keywords(query: str) -> TriageResponse:
        """Rule-based routing when LLM unavailable."""
        query_lower = query.lower()
        scores = {}
        for service, keywords in ROUTING_RULES.items():
            scores[service] = sum(1 for kw in keywords if kw in query_lower)
        if not scores or max(scores.values()) == 0:
            return TriageResponse(
                target_service="concepts",
                confidence=0.3,
                reasoning="No clear match - default to concepts",
                suggested_action="General inquiry"
            )
        best = max(scores, key=scores.get)
        return TriageResponse(
            target_service=best,
            confidence=0.7,
            reasoning=f"Matched keywords: {ROUTING_RULES[best][:2]}",
            suggested_action=f"Handle as {best} request"
        )

    async def route_with_llm(query: str) -> TriageResponse:
        """LLM-based routing with structured output."""
        try:
            api_key = os.getenv("GLM_API_KEY") or os.getenv("OPENAI_API_KEY")
            if not api_key:
                return route_by_keywords(query)

            base_url = os.getenv("LLM_BASE_URL", "https://open.bigmodel.cn/api/paas/v4/")
            model = os.getenv("LLM_MODEL", "glm-4.7-flash")

            client = AsyncOpenAI(api_key=api_key, base_url=base_url)

            system_prompt = """You are a query router for an AI learning platform.
            Route queries to: concepts, debug, exercise, code-review, or progress.
            Return ONLY valid JSON: {"target_service": "service", "confidence": 0.0-1.0, "reasoning": "why", "suggested_action": "action"}"""

            response = await client.chat.completions.create(
                model=model,
                messages=[
                    {"role": "system", "content": system_prompt},
                    {"role": "user", "content": f"Route this query: {query}"}
                ],
                temperature=0.3,
                max_tokens=200
            )

            result = json.loads(response.choices[0].message.content)
            return TriageResponse(**result)
        except Exception as e:
            logger.error(f"LLM routing failed: {e}")
            return route_by_keywords(query)

    @app.get("/")
    async def root():
        return {
            "service": "triage-service",
            "version": "3.0.0",
            "llm_enabled": HAS_LLM
        }

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "triage-service"}

    @app.post("/api/v1/triage", response_model=TriageResponse)
    async def triage_query(request: TriageRequest) -> TriageResponse:
        """Route incoming query to appropriate service."""
        try:
            logger.info(f"Triage request from {request.student_id or 'anonymous'}: {request.query[:50]}...")

            if HAS_LLM:
                response = await route_with_llm(request.query)
            else:
                response = route_by_keywords(request.query)

            logger.info(f"Routed to {response.target_service} (confidence: {response.confidence})")
            return response

        except Exception as e:
            logger.error(f"Triage error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8001)

---
# Concepts Service with full business logic
apiVersion: v1
kind: ConfigMap
metadata:
  name: concepts-service-complete
  namespace: learnflow
data:
  main.py: |
    """Concepts Service - Explains Python concepts with examples."""
    import sys
    import os
    import json
    import logging
    from typing import Dict, Any, Optional
    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Concepts Service", version="3.0.0")

    try:
        from openai import AsyncOpenAI
        HAS_LLM = True
    except ImportError:
        HAS_LLM = False

    class ExplainRequest(BaseModel):
        query: str
        student_id: Optional[str] = None
        mastery_level: str = "beginner"

    class ExplainResponse(BaseModel):
        explanation: str
        examples: list[str]
        related_concepts: list[str]
        mastery_level: str

    # Fallback explanations for common concepts
    CONCEPT_EXPLANATIONS = {
        "variables": {
            "explanation": "Variables are containers for storing data values. In Python, you create a variable by assigning a value to it.",
            "examples": ["name = 'Alice'", "age = 25", "pi = 3.14159"],
            "related": ["data types", "assignment", "naming conventions"]
        },
        "loops": {
            "explanation": "Loops allow you to repeat code multiple times. Python has 'for' loops (iterate over sequences) and 'while' loops (repeat while condition is true).",
            "examples": ["for i in range(5): print(i)", "while x < 10: x += 1"],
            "related": ["iteration", "range", "break", "continue"]
        },
        "functions": {
            "explanation": "Functions are reusable blocks of code. They help organize code and avoid repetition.",
            "examples": ["def greet(name): return f'Hello, {name}!'", "def add(a, b): return a + b"],
            "related": ["parameters", "return", "scope", "decorators"]
        }
    }

    async def explain_with_llm(query: str, mastery_level: str) -> ExplainResponse:
        """Generate explanation using LLM."""
        try:
            api_key = os.getenv("GLM_API_KEY") or os.getenv("OPENAI_API_KEY")
            if not api_key:
                return explain_fallback(query, mastery_level)

            base_url = os.getenv("LLM_BASE_URL", "https://open.bigmodel.cn/api/paas/v4/")
            model = os.getenv("LLM_MODEL", "glm-4.7-flash")

            client = AsyncOpenAI(api_key=api_key, base_url=base_url)

            system_prompt = f"""You are a Python tutor for {mastery_level} level students.
            Explain concepts clearly with examples. Return JSON:
            {{
                "explanation": "clear explanation",
                "examples": ["code example 1", "code example 2"],
                "related_concepts": ["concept1", "concept2"]
            }}"""

            response = await client.chat.completions.create(
                model=model,
                messages=[
                    {"role": "system", "content": system_prompt},
                    {"role": "user", "content": query}
                ],
                temperature=0.7,
                max_tokens=800
            )

            result = json.loads(response.choices[0].message.content)
            return ExplainResponse(
                explanation=result.get("explanation", "Explanation unavailable"),
                examples=result.get("examples", []),
                related_concepts=result.get("related_concepts", []),
                mastery_level=mastery_level
            )
        except Exception as e:
            logger.error(f"LLM explanation failed: {e}")
            return explain_fallback(query, mastery_level)

    def explain_fallback(query: str, mastery_level: str) -> ExplainResponse:
        """Fallback to pre-defined explanations."""
        query_lower = query.lower()
        for concept, data in CONCEPT_EXPLANATIONS.items():
            if concept in query_lower:
                return ExplainResponse(
                    explanation=data["explanation"],
                    examples=data["examples"],
                    related_concepts=data["related"],
                    mastery_level=mastery_level
                )
        return ExplainResponse(
            explanation=f"I'd be happy to explain '{query}'. For the best explanation, please ensure the LLM API is configured.",
            examples=[f"# Example for {query}", "print('Your code here')"],
            related_concepts=["related topic 1", "related topic 2"],
            mastery_level=mastery_level
        )

    @app.get("/")
    async def root():
        return {"service": "concepts-service", "version": "3.0.0", "llm_enabled": HAS_LLM}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "concepts-service"}

    @app.post("/api/v1/explain", response_model=ExplainResponse)
    async def explain_concept(request: ExplainRequest) -> ExplainResponse:
        """Explain a Python concept."""
        try:
            logger.info(f"Explaining '{request.query}' for {request.mastery_level} student")
            if HAS_LLM:
                return await explain_with_llm(request.query, request.mastery_level)
            return explain_fallback(request.query, request.mastery_level)
        except Exception as e:
            logger.error(f"Explanation error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8002)

