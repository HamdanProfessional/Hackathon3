# Deployments for all services
# Triage Service Deployment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  namespace: learnflow
  labels:
    app: triage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
    spec:
      containers:
      - name: triage-service
        image: python:3.11-slim
        command: ['sh', '-c', 'pip install fastapi uvicorn openai pydantic 2>&1 | tail -3 && cat /app/main.py | head -5 && python /app/main.py']
        env:
        - name: PORT
          value: "8001"
        - name: LLM_PROVIDER
          value: "glm"
        - name: LLM_MODEL
          value: "glm-4.7-flash"
        - name: LLM_BASE_URL
          value: "https://open.bigmodel.cn/api/paas/v4/"
        - name: GLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-credentials
              key: glm-api-key
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: api-key
              optional: true
        ports:
        - containerPort: 8001
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi
        volumeMounts:
        - name: app-code
          mountPath: /app
      volumes:
      - name: app-code
        configMap:
          name: triage-service-complete

