# Simple LearnFlow Deployment - All code inline in ConfigMaps
# Eliminates init container complexity

---
# Triage Service - All code in one ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-service-full
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app")

    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel
    from typing import Optional
    import logging
    import os

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Triage Service", version="1.0.0")

    class TriageRequest(BaseModel):
        query: str
        student_id: Optional[str] = None

    class TriageResponse(BaseModel):
        target_service: str
        confidence: float
        reasoning: str

    @app.get("/")
    async def root():
        return {"service": "triage-service", "status": "running", "endpoints": {"/health", "/api/v1/triage"}}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "triage-service"}

    @app.post("/api/v1/triage")
    async def triage_query(request: TriageRequest):
        try:
            logger.info(f"Triage request: {request.query[:100]}...")
            # Simple routing logic
            query_lower = request.query.lower()
            if any(word in query_lower for word in ["explain", "what is", "how does", "concept"]):
                return TriageResponse(target_service="concepts", confidence=0.8, reasoning="Query asks for explanation")
            elif any(word in query_lower for word in ["error", "bug", "fix", "debug", "not working"]):
                return TriageResponse(target_service="debug", confidence=0.85, reasoning="Query mentions error or bug")
            elif any(word in query_lower for word in ["exercise", "practice", "challenge"]):
                return TriageResponse(target_service="exercise", confidence=0.9, reasoning="Query requests exercise")
            elif any(word in query_lower for word in ["progress", "score", "mastery"]):
                return TriageResponse(target_service="progress", confidence=0.9, reasoning="Query asks about progress")
            else:
                return TriageResponse(target_service="concepts", confidence=0.5, reasoning="Default to concepts service")
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8001)

---
apiVersion: v1
kind: Service
metadata:
  name: triage-service
  namespace: learnflow
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: triage-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  namespace: learnflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
      annotations:
        dapr.io/enabled: "false"  # Disable Dapr for now
    spec:
      containers:
      - name: triage-service
        image: python:3.11-slim
        command: ['sh', '-c', 'pip install fastapi uvicorn pydantic 2>&1 | tail -3 && echo "=== CODE ===" && cat /app/main.py | head -5 && python /app/main.py']
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: app-code
        configMap:
          name: triage-service-full

