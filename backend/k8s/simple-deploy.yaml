# Concepts Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: concepts-service-full
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app")

    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel
    from typing import Optional
    import logging

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Concepts Service", version="1.0.0")

    class ExplainRequest(BaseModel):
        query: str
        student_id: Optional[str] = None
        mastery_level: str = "Beginner"

    @app.get("/")
    async def root():
        return {"service": "concepts-service", "status": "running"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "concepts-service"}

    @app.post("/api/v1/concepts/explain")
    async def explain(request: ExplainRequest):
        try:
            logger.info(f"Explain request: {request.query[:100]}...")
            return {
                "explanation": f"Here's an explanation for '{request.query}' at {request.mastery_level} level.",
                "example": "# Example code\nprint('Hello, World!')",
                "topic": request.query.split()[0] if request.query.split() else "Python"
            }
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8002)

