# Debug Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-service-full
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app")

    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel
    import logging

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Debug Service", version="1.0.0")

    class DebugRequest(BaseModel):
        query: str
        error_message: str = ""
        hint_level: int = 1

    @app.get("/")
    async def root():
        return {"service": "debug-service", "status": "running"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "debug-service"}

    @app.post("/api/v1/debug/analyze")
    async def analyze(request: DebugRequest):
        try:
            logger.info(f"Debug request: {request.query[:100]}...")
            hints = [
                f"Hint 1: Check the error type - '{request.error_message or 'your error'}'",
                f"Hint 2: Look at line numbers in the traceback",
                f"Hint 3: Review variable names and function calls"
            ]
            hint = hints[min(request.hint_level - 1, 2)]
            return {"hint": hint, "level": request.hint_level}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8003)

