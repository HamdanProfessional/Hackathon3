# Exercise Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: exercise-service-full
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app")

    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel
    import logging

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Exercise Service", version="1.0.0")

    class ExerciseRequest(BaseModel):
        query: str
        module: int = 1
        difficulty: str = "beginner"

    class SubmissionRequest(BaseModel):
        code: str
        exercise_id: str

    @app.get("/")
    async def root():
        return {"service": "exercise-service", "status": "running"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "exercise-service"}

    @app.post("/api/v1/exercise/generate")
    async def generate(request: ExerciseRequest):
        try:
            logger.info(f"Generate exercise for module {request.module}")
            return {
                "exercise": {
                    "id": "ex_001",
                    "title": f"Module {request.module} Exercise",
                    "description": "Write a function that returns a greeting",
                    "starter_code": "def greet(name):\n    # Your code here\n    pass",
                    "hints": ["Use a return statement", "Include the name parameter", "Test with different names"]
                }
            }
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    @app.post("/api/v1/exercise/submit")
    async def submit(request: SubmissionRequest):
        try:
            return {"feedback": "Great attempt! Your code runs correctly.", "passed": True}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8004)

