# Code Review Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-review-service-full
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app")

    from fastapi import FastAPI, HTTPException
    from pydantic import BaseModel
    import logging

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Code Review Service", version="1.0.0")

    class ReviewRequest(BaseModel):
        code: str

    @app.get("/")
    async def root():
        return {"service": "code-review-service", "status": "running"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "code-review-service"}

    @app.post("/api/v1/review/analyze")
    async def analyze(request: ReviewRequest):
        try:
            logger.info(f"Review request: {len(request.code)} characters")
            lines = request.code.split('\n')
            return {
                "review": {
                    "overall_score": 75,
                    "correctness": 80,
                    "style": 70,
                    "efficiency": 75,
                    "readability": 75,
                    "suggestions": [
                        "Add docstrings to functions",
                        "Use more descriptive variable names",
                        "Consider using list comprehensions"
                    ]
                }
            }
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8006)

