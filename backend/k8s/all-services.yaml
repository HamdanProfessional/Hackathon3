# All LearnFlow Backend Services Deployments
# This file contains all services for deployment

---
# Concepts Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concepts-service
  namespace: learnflow
  labels:
    app: concepts-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: concepts-service
  template:
    metadata:
      labels:
        app: concepts-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "concepts-service"
        dapr.io/app-port: "8002"
        dapr.io/enable-api-logging: "true"
    spec:
      imagePullSecrets:
      - name: ghcr-registry
      containers:
      - name: concepts-service
        image: ghcr.io/hamdanprofessional/learnflow-concepts-service:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8002
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection-string
        # LLM Provider Configuration (supports both GLM and OpenAI)
        - name: LLM_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: LLM_PROVIDER
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: LLM_MODEL
        - name: GLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: GLM_API_KEY
              optional: true
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: OPENAI_API_KEY
              optional: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: concepts-service
  namespace: learnflow
spec:
  type: ClusterIP
  selector:
    app: concepts-service
  ports:
  - port: 8002
    targetPort: 8002

