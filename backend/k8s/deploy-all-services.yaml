---
# Ingress for all services (optional)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnflow-backend-ingress
  namespace: learnflow
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: api.learnflow.local
    http:
      paths:
      - path: /triage
        pathType: Prefix
        backend:
          service:
            name: triage-service
            port:
              number: 8000
      - path: /concepts
        pathType: Prefix
        backend:
          service:
            name: concepts-service
            port:
              number: 8000
      - path: /debug
        pathType: Prefix
        backend:
          service:
            name: debug-service
            port:
              number: 8000
      - path: /exercise
        pathType: Prefix
        backend:
          service:
            name: exercise-service
            port:
              number: 8000
      - path: /progress
        pathType: Prefix
        backend:
          service:
            name: progress-service
            port:
              number: 8000
      - path: /code-review
        pathType: Prefix
        backend:
          service:
            name: code-review-service
            port:
              number: 8000
