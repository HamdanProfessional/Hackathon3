# LearnFlow Backend Services - Complete Deployment
# This file demonstrates Skills Autonomy - single file deploys all 6 services
# Part of Hackathon 3 Skills Autonomy demonstration

apiVersion: v1
kind: Namespace
metadata:
  name: learnflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: learnflow-config
  namespace: learnflow
data:
  OPENAI_MODEL: "gpt-4"
  LOG_LEVEL: "INFO"
  KAFKA_BROKER: "kafka.kafka.svc.cluster.local:9092"
---
# Triage Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  namespace: learnflow
  labels:
    app: triage-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "triage-service"
        dapr.io/app-port: "8000"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: triage-service
        image: learnflow/triage-service:v1
        imagePullPolicy: Never  # Use local images for Minikube
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: learnflow-secrets
              key: openai-api-key
              optional: true
        - name: KAFKA_BROKER
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: KAFKA_BROKER
---
apiVersion: v1
kind: Service
metadata:
  name: triage-service
  namespace: learnflow
spec:
  selector:
    app: triage-service
  ports:
  - port: 8000
    targetPort: 8000
---
