# LearnFlow Backend Services - Local Deployment for Minikube
# Uses locally built images loaded into Minikube

---
# ConfigMap (already applied, keeping for reference)
apiVersion: v1
kind: ConfigMap
metadata:
  name: learnflow-config
  namespace: learnflow
data:
  DB_HOST: "postgres-postgresql.postgres.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "learnflow"
  DB_USER: "learnflow"
  LLM_PROVIDER: "glm"
  LLM_MODEL: "glm-4.7"
  LOG_LEVEL: "INFO"
  KAFKA_BROKER: "redpanda-0.redpanda.redpanda-system.svc.cluster.local:9093"
---
# Triage Service (Port 8001)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  namespace: learnflow
  labels:
    app: triage-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "triage-service"
        dapr.io/app-port: "8001"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: triage-service
        image: learnflow/triage-service:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection-string
        - name: LLM_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: LLM_PROVIDER
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: LLM_MODEL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: OPENAI_API_KEY
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: LOG_LEVEL
---
apiVersion: v1
kind: Service
metadata:
  name: triage-service
  namespace: learnflow
spec:
  type: ClusterIP
  selector:
    app: triage-service
  ports:
  - port: 8001
    targetPort: 8001
---
# Concepts Service (Port 8002)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: concepts-service
  namespace: learnflow
  labels:
    app: concepts-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: concepts-service
  template:
    metadata:
      labels:
        app: concepts-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "concepts-service"
        dapr.io/app-port: "8002"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: concepts-service
        image: learnflow/concepts-service:v3
        imagePullPolicy: Never
        ports:
        - containerPort: 8002
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection-string
        - name: LLM_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: LLM_PROVIDER
        - name: LLM_MODEL
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: LLM_MODEL
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: llm-secret
              key: OPENAI_API_KEY
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: learnflow-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: concepts-service
  namespace: learnflow
spec:
  type: ClusterIP
  selector:
    app: concepts-service
  ports:
  - port: 8002
    targetPort: 8002
