apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-kafka
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app/common")

    from fastapi import FastAPI, HTTPException
    import logging
    from agent_base import DebugAgent
    from models import DebugRequest
    import kafka_client

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Debug Service", version="2.1.0")
