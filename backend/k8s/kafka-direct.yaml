---
# Code Review Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-review-kafka
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app/common")

    from fastapi import FastAPI, HTTPException
    import logging
    from agent_base import CodeReviewAgent
    from models import ReviewRequest
    import kafka_client

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Code Review Service", version="2.1.0")
    agent = CodeReviewAgent()

    @app.get("/")
    async def root():
        return {"service": "code-review-service", "version": "2.1.0"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "code-review-service"}

    @app.post("/api/v1/review/analyze")
    async def analyze(request: ReviewRequest):
        try:
            result = await agent.process(request.code, {})

            kafka_client.publish_event_async("code.review", {
                "code_length": len(request.code)
            })

            return {"review": {"raw_response": result}}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8006)

---
apiVersion: v1
kind: Service
metadata:
  name: code-review-service
  namespace: learnflow
spec:
  type: ClusterIP
  ports:
  - port: 8006
    targetPort: 8006
  selector:
    app: code-review-service

---
