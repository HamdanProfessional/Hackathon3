# Progress Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: progress-kafka
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app/common")

    from fastapi import FastAPI, HTTPException
    import logging
    from agent_base import ProgressAgent
    import kafka_client

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Progress Service", version="2.1.0")
    agent = ProgressAgent()

    @app.get("/")
    async def root():
        return {"service": "progress-service", "version": "2.1.0"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "progress-service"}

    @app.get("/api/v1/progress/{student_id}")
    async def get_progress(student_id: str):
        try:
            context = {"student_id": student_id}
            result = await agent.process("", context)

            kafka_client.publish_event_async("learning.progress", {
                "action": "view_progress",
                "student_id": student_id
            })

            import json
            return json.loads(result)
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8005)

