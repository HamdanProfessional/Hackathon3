# LearnFlow Services with Direct Kafka Client
# Uses confluent-kafka to bypass Dapr's Kafka/Redpanda compatibility issues

---
# ConfigMap with common module (including Kafka client)
apiVersion: v1
kind: ConfigMap
metadata:
  name: learnflow-common-kafka
  namespace: learnflow
data:
  kafka_client.py: |
    """
    Direct Kafka Client for LearnFlow Services
    Works with Redpanda (Kafka-compatible)
    """
    import json
    import logging
    import os
    from typing import Dict, Any, Optional
    from confluent_kafka import Producer, KafkaError
    from threading import Thread

    logger = logging.getLogger(__name__)
    KAFKA_BROKERS = os.getenv("KAFKA_BROKERS", "redpanda.redpanda-system.svc.cluster.local:9093")

    def get_kafka_producer() -> Producer:
        config = {
            'bootstrap.servers': KAFKA_BROKERS,
            'client.id': 'learnflow-producer',
            'acks': 'all',
            'compression.type': 'snappy',
            'linger.ms': '10',
            'enable.idempotence': 'true',
            'delivery.timeout.ms': '30000',
        }
        return Producer(config)

    def publish_event(topic: str, event_data: Dict[str, Any], key: Optional[str] = None) -> bool:
        """Publish an event to Kafka topic."""
        try:
            producer = get_kafka_producer()
            value = json.dumps(event_data).encode('utf-8')
            key_bytes = key.encode('utf-8') if key else None

            def delivery_report(err, msg):
                if err:
                    logger.error(f"Kafka delivery failed: {err}")
                else:
                    logger.info(f"Event published to {msg.topic()}")

            producer.produce(topic=topic, key=key_bytes, value=value, on_delivery=delivery_report)
            producer.flush(timeout=5)
            return True
        except Exception as e:
            logger.error(f"Kafka publish error: {e}")
            return False

    def publish_event_async(topic: str, event_data: Dict[str, Any]) -> bool:
        """Publish event asynchronously (fire-and-forget)."""
        def publish_in_background():
            publish_event(topic, event_data)
        Thread(target=publish_in_background, daemon=True).start()
        return True

  llm_client.py: |
    """LLM Client for GLM 4.7 / OpenAI"""
    import os
    from enum import Enum
    from typing import Optional
    from openai import AsyncOpenAI

    class LLMProvider(str, Enum):
        OPENAI = "openai"
        GLM = "glm"

    PROVIDER_CONFIGS = {
        LLMProvider.OPENAI: {"default_model": "gpt-4o-mini"},
        LLMProvider.GLM: {
            "base_url": "https://open.bigmodel.cn/api/paas/v4/",
            "default_model": "glm-4.7",
        }
    }

    def get_llm_client(provider=None, api_key=None, async_client=True):
        if provider is None:
            provider_str = os.getenv("LLM_PROVIDER", "openai").lower()
            provider = LLMProvider(provider_str)
        if api_key is None:
            if provider == LLMProvider.OPENAI:
                api_key = os.getenv("OPENAI_API_KEY")
            elif provider == LLMProvider.GLM:
                api_key = os.getenv("GLM_API_KEY") or os.getenv("ZAI_API_KEY")
        if not api_key:
            return None
        config = {"api_key": api_key}
        if provider in PROVIDER_CONFIGS:
            config["base_url"] = PROVIDER_CONFIGS[provider].get("base_url")
        ClientClass = AsyncOpenAI if async_client else None
        if ClientClass:
            return ClientClass(**config)
        return None

  agent_base.py: |
    """Base Agent with LLM integration"""
    import sys
    import os
    sys.path.insert(0, "/app/common")

    import json
    import logging
    from llm_client import get_llm_client, LLMProvider

    logger = logging.getLogger(__name__)

    class BaseAgent:
        def __init__(self, provider=None):
            if provider is None:
                provider_str = os.getenv("LLM_PROVIDER", "openai").lower()
                provider = LLMProvider(provider_str)
            self.provider = provider
            self.client = get_llm_client(provider, async_client=True)
            self.model = os.getenv("LLM_MODEL") or "gpt-4o-mini"
            self.has_llm = self.client is not None
            logger.info(f"Initialized {self.__class__.__name__} with LLM: {self.has_llm}")

        async def call_llm(self, messages, temperature=0.7, max_tokens=1000):
            if not self.client:
                return self._fallback_response(messages)
            try:
                response = await self.client.chat.completions.create(
                    model=self.model,
                    messages=messages,
                    temperature=temperature,
                    max_tokens=max_tokens
                )
                return response.choices[0].message.content
            except Exception as e:
                logger.error(f"LLM error: {e}")
                return self._fallback_response(messages)

        def _fallback_response(self, messages):
            return "LLM service unavailable."

    class TriageAgent(BaseAgent):
        async def process(self, query: str, context: Dict[str, Any]) -> str:
            system_prompt = """Route to: concepts, debug, exercise, progress, code-review.
    Return JSON: {"target_service": "service", "confidence": 0.9, "reasoning": "why"}"""
            messages = [{"role": "system", "content": system_prompt}, {"role": "user", "content": query}]
            return await self.call_llm(messages, temperature=0.3)

    class ConceptsAgent(BaseAgent):
        async def process(self, query: str, context: Dict[str, Any]) -> str:
            mastery = context.get("mastery_level", "Beginner")
            system_prompt = f"Explain Python concepts to a {mastery} student."
            messages = [{"role": "system", "content": system_prompt}, {"role": "user", "content": query}]
            return await self.call_llm(messages, temperature=0.7)

    class DebugAgent(BaseAgent):
        async def process(self, query: str, context: Dict[str, Any]) -> str:
            hint_level = context.get("hint_level", 1)
            system_prompt = f"Provide hint level {hint_level}/3. Don't give full solution."
            messages = [{"role": "system", "content": system_prompt}, {"role": "user", "content": query}]
            return await self.call_llm(messages, temperature=0.5)

    class ExerciseAgent(BaseAgent):
        async def process(self, query: str, context: Dict[str, Any]) -> str:
            action = context.get("action", "generate")
            if action == "generate":
                system_prompt = "Generate a Python exercise with title, description, starter code, test cases."
            else:
                system_prompt = "Grade the Python code submission. Be encouraging."
            messages = [{"role": "system", "content": system_prompt}, {"role": "user", "content": query}]
            return await self.call_llm(messages, temperature=0.5)

    class ProgressAgent(BaseAgent):
        async def process(self, query: str, context: Dict[str, Any]) -> str:
            student_id = context.get("student_id", "unknown")
            return json.dumps({"student_id": student_id, "overall_mastery": 35})

    class CodeReviewAgent(BaseAgent):
        async def process(self, query: str, context: Dict[str, Any]) -> str:
            system_prompt = "Review Python code for correctness, style, efficiency. Give scores 0-100."
            messages = [{"role": "system", "content": system_prompt}, {"role": "user", "content": query}]
            return await self.call_llm(messages, temperature=0.5)

  models.py: |
    from pydantic import BaseModel
    from typing import Optional

    class TriageRequest(BaseModel):
        query: str
        student_id: Optional[str] = None

    class TriageResponse(BaseModel):
        target_service: str
        confidence: float
        reasoning: str

    class ExplainRequest(BaseModel):
        query: str
        student_id: Optional[str] = None
        mastery_level: str = "Beginner"

    class DebugRequest(BaseModel):
        query: str
        error_message: str = ""
        hint_level: int = 1

    class ExerciseRequest(BaseModel):
        query: str
        module: int = 1
        difficulty: str = "beginner"

    class SubmissionRequest(BaseModel):
        code: str
        exercise_id: str

    class ReviewRequest(BaseModel):
        code: str

---
# Triage Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: triage-kafka
  namespace: learnflow
data:
  main.py: |
    import sys
    import os
    sys.path.insert(0, "/app/common")

    from fastapi import FastAPI, HTTPException
    import json
    import logging

    from agent_base import TriageAgent
    from models import TriageRequest, TriageResponse
    import kafka_client

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Triage Service", version="2.1.0")
    agent = TriageAgent()

    @app.get("/")
    async def root():
        return {"service": "triage-service", "version": "2.1.0", "kafka": "direct", "llm_available": agent.has_llm}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "triage-service"}

    @app.post("/api/v1/triage")
    async def triage_query(request: TriageRequest):
        try:
            logger.info(f"Triage: {request.query[:100]}...")
            context = {"student_id": str(request.student_id)} if request.student_id else {}
            result = await agent.process(request.query, context)

            # Parse routing result
            try:
                routing = json.loads(result)
                response = TriageResponse(**routing)
            except:
                response = TriageResponse(target_service="concepts", confidence=0.5, reasoning="Default routing")

            # Publish to Kafka (async, non-blocking)
            kafka_client.publish_event_async("learning.progress", {
                "student_id": request.student_id or "anonymous",
                "query": request.query[:100],
                "routed_to": response.target_service
            })

            return response
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8001)

---
apiVersion: v1
kind: Service
metadata:
  name: triage-service
  namespace: learnflow
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
  selector:
    app: triage-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
  namespace: learnflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triage-service
  template:
    metadata:
      labels:
        app: triage-service
    spec:
      initContainers:
      - name: setup
        image: python:3.11-slim
        command: ['sh', '-c', 'mkdir -p /app/common && for f in /common/*; do cp "$f" /app/common/; done && for f in /service/*; do cp "$f" /app/; done']
        volumeMounts:
        - name: common-code
          mountPath: /common
        - name: service-code
          mountPath: /service
      containers:
      - name: triage-service
        image: python:3.11-slim
        command: ['sh', '-c', 'pip install fastapi uvicorn openai pydantic confluent-kafka 2>&1 | tail -3 && cd /app && python main.py']
        ports:
        - containerPort: 8001
        env:
        - name: PORT
          value: "8001"
        - name: LLM_PROVIDER
          value: "glm"
        - name: LLM_MODEL
          value: "glm-4.7"
        - name: GLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: api-key
        - name: KAFKA_BROKERS
          value: "redpanda.redpanda-system.svc.cluster.local:9093"
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: common-code
        configMap:
          name: learnflow-common-kafka
      - name: service-code
        configMap:
          name: triage-kafka
      - name: app-code
        emptyDir: {}

