# Exercise Service with Full LLM Integration
apiVersion: v1
kind: ConfigMap
metadata:
  name: exercise-service-enhanced
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app/common")

    from fastapi import FastAPI, HTTPException
    from agent_base import ExerciseAgent
    from models import ExerciseRequest, SubmissionRequest
    import logging
    import json
    import dapr_client

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Exercise Service", version="2.0.0")
    agent = ExerciseAgent()

    @app.get("/")
    async def root():
        return {"service": "exercise-service", "version": "2.0.0", "llm_available": agent.has_llm}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "exercise-service", "llm_available": agent.has_llm}

    @app.post("/api/v1/exercise/generate")
    async def generate(request: ExerciseRequest):
        try:
            logger.info(f"Generate exercise for module {request.module}")
            context = {
                "action": "generate",
                "module": request.module,
                "difficulty": request.difficulty
            }
            result = await agent.process(request.query, context)

            # Publish event
            dapr_client.publish_event("exercise.generated", {
                "module": request.module,
                "difficulty": request.difficulty
            })

            try:
                exercise_data = json.loads(result)
                return {"exercise": exercise_data}
            except:
                return {"exercise": {"raw_response": result}}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    @app.post("/api/v1/exercise/submit")
    async def submit(request: SubmissionRequest):
        try:
            context = {"action": "grade"}
            result = await agent.process(request.code, context)

            # Publish event
            dapr_client.publish_event("exercise.attempt", {
                "exercise_id": request.exercise_id,
                "code_length": len(request.code)
            })

            return {"feedback": result}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8004)

---
