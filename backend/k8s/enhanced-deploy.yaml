# Debug Service with Full LLM Integration
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-service-enhanced
  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app/common")

    from fastapi import FastAPI, HTTPException
    from agent_base import DebugAgent
    from models import DebugRequest
    import logging
    import dapr_client

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Debug Service", version="2.0.0")
    agent = DebugAgent()

    @app.get("/")
    async def root():
        return {"service": "debug-service", "version": "2.0.0", "llm_available": agent.has_llm}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "debug-service", "llm_available": agent.has_llm}

    @app.post("/api/v1/debug/analyze")
    async def analyze(request: DebugRequest):
        try:
            logger.info(f"Debug request: {request.query[:100]}...")
            context = {
                "error_message": request.error_message,
                "hint_level": request.hint_level
            }
            result = await agent.process(request.query, context)

            # Publish event
            dapr_client.publish_event("code.debug", {
                "error_message": request.error_message[:100],
                "hint_level": request.hint_level
            })

            return {"hint": result, "level": request.hint_level}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8003)

