  namespace: learnflow
data:
  main.py: |
    import sys
    sys.path.insert(0, "/app/common")

    from fastapi import FastAPI, HTTPException
    from agent_base import ConceptsAgent
    from models import ExplainRequest
    import logging
    import dapr_client

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Concepts Service", version="2.0.0")
    agent = ConceptsAgent()

    @app.get("/")
    async def root():
        return {"service": "concepts-service", "version": "2.0.0", "llm_available": agent.has_llm}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "concepts-service", "llm_available": agent.has_llm}

    @app.post("/api/v1/concepts/explain")
    async def explain(request: ExplainRequest):
        try:
            logger.info(f"Explain request: {request.query[:100]}...")
            context = {"mastery_level": request.mastery_level}
            result = await agent.process(request.query, context)

            # Publish event
            dapr_client.publish_event("learning.concept", {
                "student_id": request.student_id,
                "query": request.query[:100],
                "mastery_level": request.mastery_level
            })

            return {"explanation": result}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8002)

