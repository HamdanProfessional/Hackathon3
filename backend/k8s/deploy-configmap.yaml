# Exercise Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: exercise-service-code
  namespace: learnflow
data:
  main.py: |
    """Exercise Service - Generates and grades exercises."""
    from fastapi import FastAPI, HTTPException
    import sys
    sys.path.insert(0, "/app/common")

    from agent_base import ExerciseAgent
    from pydantic import BaseModel
    import logging

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Exercise Service", version="1.0.0")
    agent = ExerciseAgent()

    class ExerciseRequest(BaseModel):
        query: str
        module: int = 1
        difficulty: str = "beginner"

    class SubmissionRequest(BaseModel):
        code: str
        exercise_id: str

    @app.get("/")
    async def root():
        return {"service": "exercise-service", "status": "running"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "exercise-service"}

    @app.post("/api/v1/exercise/generate")
    async def generate(request: ExerciseRequest):
        try:
            context = {"action": "generate", "module": request.module, "difficulty": request.difficulty}
            result = await agent.process(request.query, context)
            return {"exercise": result}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    @app.post("/api/v1/exercise/submit")
    async def submit(request: SubmissionRequest):
        try:
            context = {"action": "grade"}
            result = await agent.process(request.code, context)
            return {"feedback": result}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8004)

