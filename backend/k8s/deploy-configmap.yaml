          value: "glm-4.7"
        - name: GLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: api-key
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: common-code
        configMap:
          name: learnflow-common-code
      - name: service-code
        configMap:
          name: progress-service-code
      - name: app-code
        emptyDir: {}

---
# Code Review Service
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-review-service-code
  namespace: learnflow
data:
  main.py: |
    """Code Review Service - Analyzes code quality."""
    from fastapi import FastAPI, HTTPException
    import sys
    sys.path.insert(0, "/app/common")

    from agent_base import CodeReviewAgent
    from pydantic import BaseModel
    import logging

    logging.basicConfig(level=logging.INFO)
    logger = logging.getLogger(__name__)

    app = FastAPI(title="Code Review Service", version="1.0.0")
    agent = CodeReviewAgent()

    class ReviewRequest(BaseModel):
        code: str

    @app.get("/")
    async def root():
        return {"service": "code-review-service", "status": "running"}

    @app.get("/health")
    async def health():
        return {"status": "healthy", "service": "code-review-service"}

    @app.post("/api/v1/review/analyze")
    async def analyze(request: ReviewRequest):
        try:
            result = await agent.process(request.code, {})
            return {"review": result}
        except Exception as e:
            logger.error(f"Error: {e}")
            raise HTTPException(status_code=500, detail=str(e))

    if __name__ == "__main__":
        import uvicorn
        uvicorn.run(app, host="0.0.0.0", port=8006)

---
apiVersion: v1
kind: Service
metadata:
  name: code-review-service
  namespace: learnflow
spec:
  type: ClusterIP
  ports:
  - port: 8006
    targetPort: 8006
  selector:
    app: code-review-service

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-review-service
  namespace: learnflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: code-review-service
  template:
    metadata:
      labels:
        app: code-review-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "code-review-service"
        dapr.io/app-port: "8006"
    spec:
      initContainers:
      - name: copy-common
        image: python:3.11-slim
        command: ['sh', '-c', 'mkdir -p /app/common && cp /common/* /app/common/']
        volumeMounts:
        - name: common-code
          mountPath: /common
      - name: copy-service
        image: python:3.11-slim
        command: ['sh', '-c', 'cp /service-code/main.py /app/']
        volumeMounts:
        - name: service-code
          mountPath: /service-code
      containers:
      - name: code-review-service
        image: python:3.11-slim
        command: ['sh', '-c', 'pip install fastapi uvicorn dapr openai pydantic 2>&1 | tail -5 && cd /app && python main.py']
        ports:
        - containerPort: 8006
        env:
        - name: PORT
          value: "8006"
        - name: LLM_PROVIDER
          value: "glm"
        - name: LLM_MODEL
          value: "glm-4.7"
        - name: GLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-credentials
              key: api-key
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: common-code
        configMap:
          name: learnflow-common-code
      - name: service-code
        configMap:
          name: code-review-service-code
      - name: app-code
        emptyDir: {}
