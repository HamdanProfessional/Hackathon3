# Dapr PubSub Component for Kafka/Redpanda
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: learnflow
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: redpanda-0.redpanda.redpanda-system.svc.cluster.local:9093
  - name: consumerGroup
    value: learnflow-group
  - name: authRequired
    value: "false"
  - name: autoEnableSsl
    value: "false"
