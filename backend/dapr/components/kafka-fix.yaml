---
# PostgreSQL State Store (Recreated)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: postgres-state
  namespace: learnflow
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    value: "host=postgres-postgresql.postgres.svc.cluster.local port=5432 user=learnflow password=learnflow123 dbname=learnflow sslmode=disable"
  - name: tableName
    value: "state_store"
  - name: keyPrefix
    value: "none"
  - name: maxConns
    value: "10"
  - name: queryExecMode
    value: "close"
