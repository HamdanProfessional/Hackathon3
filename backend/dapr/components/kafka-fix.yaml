# Dapr Components for LearnFlow
# Fixed Kafka/Redpanda configuration

---
# Option 1: Direct Pod Connection (Most Reliable)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: kafka-pubsub
  namespace: learnflow
spec:
  type: pubsub.kafka
  version: v1
  metadata:
  - name: brokers
    value: "redpanda-0.redpanda.redpanda-system.svc.cluster.local:9093"
  - name: consumerGroup
    value: "learnflow-group"
  - name: authRequired
    value: "false"
  - name: autoEnableSsl
    value: "false"
  - name: disableLeaderElection
    value: "false"
  - name: initialOffset
    value: "newest"
  - name: maxMessageBytes
    value: "1024000"

