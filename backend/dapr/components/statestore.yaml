# Dapr State Store Component for PostgreSQL
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: postgres-state
  namespace: learnflow
spec:
  type: state.postgresql
  version: v1
  metadata:
  - name: connectionString
    secretKeyRef:
      name: postgres-credentials
      key: connection-string
  - name: tableName
    value: "state_store"
  - name: keyPrefix
    value: "none"
