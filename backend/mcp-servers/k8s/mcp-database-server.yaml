---
# MCP Database Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-database-server
  namespace: learnflow
  labels:
    app: mcp-database-server
    tier: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-database-server
  template:
    metadata:
      labels:
        app: mcp-database-server
        tier: mcp
    spec:
      containers:
      - name: mcp-database-server
        image: mcp-database-server:v5
        imagePullPolicy: Never
        command: ["python", "main.py"]
        env:
        - name: DB_HOST
          value: "postgres-postgresql.postgres.svc.cluster.local"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "learnflow"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          value: "postgres"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
