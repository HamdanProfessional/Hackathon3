apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-review-service
  namespace: learnflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: code-review-service
  template:
    metadata:
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "code-review-service"
        dapr.io/app-port: "8000"
        dapr.io/enable-api-logging: "true"
    spec:
      containers:
      - name: code-review-service
        image: code-review-service:latest
        ports:
        - containerPort: 8000
        env:
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: learnflow-secrets
              key: openai-api-key
---
apiVersion: v1
kind: Service
metadata:
  name: code-review-service
  namespace: learnflow
spec:
  selector:
    app: code-review-service
  ports:
  - port: 8000
    targetPort: 8000
