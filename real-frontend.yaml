apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-build-script
  namespace: learnflow
data:
  build.sh: |
    #!/bin/sh
    set -e
    echo "🔨 Building LearnFlow Next.js Frontend..."

    # Copy source to writable location
    cp -r /source/* /app/
    cd /app

    # Install dependencies
    echo "📦 Installing dependencies..."
    npm ci

    # Build the application
    echo "🏗️  Building Next.js app..."
    npm run build

    echo "✅ Build complete!"

    # Start the server
    echo "🚀 Starting server..."
    NODE_ENV=production node server.js
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: learnflow-frontend
  namespace: learnflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: learnflow-frontend
  template:
    metadata:
      labels:
        app: learnflow-frontend
    spec:
      initContainers:
      - name: build
        image: node:20-alpine
        command: ["/bin/sh", "/scripts/build.sh"]
        volumeMounts:
        - name: source
          mountPath: /source
        - name: app
          mountPath: /app
        - name: scripts
          mountPath: /scripts
      containers:
      - name: frontend
        image: node:20-alpine
        workingDir: /app
        command: ["node", "server.js"]
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        - name: NEXT_TELEMETRY_DISABLED
          value: "1"
        - name: NEXT_PUBLIC_API_BASE_URL
          value: "http://134.209.154.247:30801"
        - name: NEXT_PUBLIC_TRIAGE_URL
          value: "http://134.209.154.247:30801"
        - name: NEXT_PUBLIC_CONCEPTS_URL
          value: "http://134.209.154.247:30802"
        - name: NEXT_PUBLIC_DEBUG_URL
          value: "http://134.209.154.247:30803"
        - name: NEXT_PUBLIC_EXERCISE_URL
          value: "http://134.209.154.247:30804"
        - name: NEXT_PUBLIC_PROGRESS_URL
          value: "http://134.209.154.247:30805"
        - name: NEXT_PUBLIC_CODE_REVIEW_URL
          value: "http://134.209.154.247:30806"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: app
          mountPath: /app
      volumes:
      - name: source
        emptyDir: {}
      - name: app
        emptyDir: {}
      - name: scripts
        configMap:
          name: frontend-build-script
          defaultMode: 0755
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: learnflow-frontend
  namespace: learnflow
spec:
  selector:
    app: learnflow-frontend
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: learnflow-frontend-nodeport
  namespace: learnflow
spec:
  type: NodePort
  selector:
    app: learnflow-frontend
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080
