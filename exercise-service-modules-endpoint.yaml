---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exercise-service
  namespace: learnflow
spec:
  template:
    spec:
      containers:
      - name: exercise
        command:
        - sh
        - -c
        - |
          set -e
          pip install --no-cache-dir uv fastapi uvicorn pydantic httpx
          mkdir -p /app/services/exercise
          touch /app/services/__init__.py /app/services/exercise/__init__.py

          cat > /app/services/exercise/main.py << 'EOFPYTHON'
          from fastapi import FastAPI, HTTPException
          from fastapi.middleware.cors import CORSMiddleware
          from pydantic import BaseModel
          from typing import List, Optional, Dict
          from uuid import uuid4

          SERVICE_NAME = "exercise-service"
          SERVICE_VERSION = "2.1.0"
          PORT = 8004

          app = FastAPI(title="LearnFlow Exercise Service", version=SERVICE_VERSION)
          app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True, allow_methods=["*"], allow_headers=["*"])

          # Sample exercises
          ALL_EXERCISES = {
              "ex_1_1": {
                  "id": "ex_1_1", "title": "Your First Variable", "difficulty": "beginner",
                  "description": "Create a variable called my_name and assign your name to it.",
                  "instructions": "Create a variable called my_name and assign your name to it. Then print it.",
                  "starter_code": "# Write your code below\n",
                  "solution": 'my_name = "YourName"\nprint(my_name)',
                  "test_cases": [{"check": "my_name", "type": "code_check"}],
                  "hints": ["Use the assignment operator (=)", "Variables can hold strings"],
                  "skills": ["variables", "print"], "points": 10, "module_id": "basics", "topic": "Variables"
              },
              "ex_2_1": {
                  "id": "ex_2_1", "title": "If-Else Statement", "difficulty": "beginner",
                  "description": "Check if a number is positive or negative.",
                  "instructions": "Write a program that checks if a number is positive or negative.",
                  "starter_code": "number = 5\n# Add your code below",
                  "solution": 'if number > 0:\n    print("Positive")\nelse:\n    print("Negative")',
                  "test_cases": [],
                  "hints": ["Use if-else structure", "The > operator checks if positive"],
                  "skills": ["if-else", "comparison"], "points": 15, "module_id": "control_flow", "topic": "Conditionals"
              },
              "ex_3_1": {
                  "id": "ex_3_1", "title": "List Operations", "difficulty": "beginner",
                  "description": "Create a list and perform operations.",
                  "instructions": "Create a list of fruits and add/remove items.",
                  "starter_code": 'fruits = ["apple", "banana"]\n',
                  "solution": 'fruits.append("cherry")\nprint(fruits)',
                  "test_cases": [],
                  "hints": [".append() adds to end", ".pop() removes items"],
                  "skills": ["lists"], "points": 20, "module_id": "data_structures", "topic": "Lists"
              },
          }

          @app.get("/")
          async def root():
              return {"service": SERVICE_NAME, "version": SERVICE_VERSION, "status": "running"}

          @app.get("/health")
          async def health():
              return {"status": "healthy", "service": SERVICE_NAME, "version": SERVICE_VERSION}

          @app.get("/modules")
          async def get_modules():
              return {
                  "modules": [
                      {"id": "basics", "name": "Python Basics", "exercises": 5},
                      {"id": "control_flow", "name": "Control Flow", "exercises": 6},
                      {"id": "data_structures", "name": "Data Structures", "exercises": 5},
                      {"id": "functions", "name": "Functions", "exercises": 4},
                      {"id": "oop", "name": "OOP", "exercises": 4},
                      {"id": "files", "name": "Files", "exercises": 4},
                      {"id": "errors", "name": "Error Handling", "exercises": 4},
                      {"id": "libraries", "name": "Libraries", "exercises": 4},
                  ]
              }

          @app.get("/exercises/all")
          async def get_all_exercises():
              return {"exercises": list(ALL_EXERCISES.values()), "total": len(ALL_EXERCISES)}

          @app.get("/exercise/{exercise_id}")
          async def get_exercise(exercise_id: str):
              for exercise in ALL_EXERCISES.values():
                  if exercise["id"] == exercise_id:
                      return exercise
              raise HTTPException(status_code=404, detail="Exercise not found")

          @app.post("/execute")
          async def execute_code(submission: dict):
              return {"output": "Code executed successfully", "error": None, "execution_time": 0.1}

          # Teacher endpoints
          class TeacherAssignmentRequest(BaseModel):
              prompt: str
              difficulty: str
              topic: Optional[str] = None
              module_id: Optional[str] = None

          @app.post("/api/v1/teacher/generate-assignment")
          async def generate_teacher_assignment(request: TeacherAssignmentRequest):
              exercise_id = f"teacher_{uuid4().hex[:8]}"
              difficulty_points = {"beginner": 10, "intermediate": 25, "advanced": 40}
              generated = {
                  "id": exercise_id,
                  "title": f"Custom: {request.prompt[:50]}",
                  "difficulty": request.difficulty,
                  "description": f"Complete: {request.prompt}",
                  "instructions": f"Task: {request.prompt}\nDifficulty: {request.difficulty}",
                  "starter_code": f"# {request.difficulty} exercise\n# {request.prompt}\n",
                  "solution": "print('Solution')",
                  "test_cases": [],
                  "hints": ["Break it down"],
                  "skills": [request.topic.lower() if request.topic else "problem-solving"],
                  "points": difficulty_points.get(request.difficulty, 20),
                  "module_id": request.module_id or "custom",
                  "topic": request.topic or "Custom"
              }
              return {"exercise": generated, "preview": f"Created: {generated['title']}"}

          @app.post("/api/v1/teacher/save-assignment")
          async def save_teacher_assignment(data: dict):
              return {"message": f"Assignment {data.get('exercise_id', '')} created"}

          if __name__ == "__main__":
              import uvicorn
              uvicorn.run(app, host="0.0.0.0", port=PORT)
          EOFPYTHON

          cd /app && python -m uvicorn services.exercise.main:app --host 0.0.0.0 --port 8004
        ports:
        - containerPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: exercise-service
  namespace: learnflow
spec:
  selector:
    app: exercise-service
  ports:
  - port: 8004
    targetPort: 8004
  type: ClusterIP
